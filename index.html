<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2Act — מסמכים משפטיים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Heebo', system-ui, -apple-system, sans-serif;
    background: #F8F6F2;
    color: #1A1A1A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    max-width: 460px;
    width: 100%;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    text-align: center;
  }
  .brand {
    font-size: 40px;
    font-weight: 700;
    color: #8B9A7B;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 15px;
    color: #5C5C52;
    margin-bottom: 32px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.link {
    display: block;
    padding: 14px 18px;
    background: #F0EDE8;
    border-radius: 12px;
    text-decoration: none;
    color: #1A1A1A;
    font-weight: 500;
    font-size: 15px;
    transition: background 0.15s;
  }
  a.link:hover { background: #E8E5DF; }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #8A8A80;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">2Act</div>
    <div class="tagline">פעלי על הבריאות שלך</div>
    <div class="links">
      <a class="link" href="privacy.html">מדיניות פרטיות</a>
      <a class="link" href="terms.html">תנאי שימוש</a>
      <a class="link" href="support.html">תמיכה ויצירת קשר</a>
    </div>
    <div class="footer">© 2Act · 2026</div>
  </div>
</body>
</html>
